<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Picker</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --s1: #161b22; --s2: #21262d; --bd: #30363d;
      --tx: #e6edf3; --mu: #7d8590;
      --gr: #3fb950; --re: #f85149; --bl: #58a6ff; --ye: #d29922; --ac: #1f6feb;
    }
    body { background:var(--bg); color:var(--tx); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

    /* Header */
    header { background:var(--s1); border-bottom:1px solid var(--bd); padding:0 16px; height:48px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
    .logo { font-size:15px; font-weight:700; background:linear-gradient(135deg,#58a6ff,#3fb950); -webkit-background-clip:text; -webkit-text-fill-color:transparent; white-space:nowrap; }
    .mkt { font-size:11px; padding:2px 8px; border-radius:10px; font-weight:500; white-space:nowrap; }
    .mkt-open   { background:rgba(63,185,80,.15); color:var(--gr); }
    .mkt-closed { background:rgba(248,81,73,.15);  color:var(--re); }
    .mkt-pre    { background:rgba(210,153,34,.15); color:var(--ye); }
    .search-wrap { position:relative; flex:1; max-width:260px; }
    #sInput { width:100%; background:var(--s2); border:1px solid var(--bd); border-radius:6px; color:var(--tx); padding:5px 10px; font-size:12px; outline:none; transition:border-color .15s; }
    #sInput:focus { border-color:var(--ac); }
    .s-drop { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--s1); border:1px solid var(--bd); border-radius:6px; overflow:hidden; z-index:200; box-shadow:0 4px 16px rgba(0,0,0,.4); }
    .s-item { padding:7px 12px; cursor:pointer; display:flex; align-items:center; gap:8px; }
    .s-item:hover { background:var(--s2); }
    .s-sym { font-weight:600; color:var(--bl); min-width:55px; }
    .s-name { color:var(--mu); font-size:11px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .s-exch { font-size:10px; color:var(--mu); }
    .btn-ic { background:var(--s2); border:1px solid var(--bd); color:var(--mu); border-radius:6px; padding:5px 9px; cursor:pointer; font-size:16px; line-height:1; transition:all .15s; }
    .btn-ic:hover { color:var(--tx); border-color:var(--ac); }
    .disc { margin-left:auto; font-size:10px; color:var(--mu); white-space:nowrap; }

    /* Tabs */
    .tabs { background:var(--s1); border-bottom:1px solid var(--bd); display:flex; padding:0 16px; flex-shrink:0; }
    .tab { background:none; border:none; border-bottom:2px solid transparent; color:var(--mu); cursor:pointer; font-size:13px; padding:8px 18px; transition:all .15s; margin-bottom:-1px; }
    .tab:hover { color:var(--tx); }
    .tab.active { color:var(--tx); border-bottom-color:var(--ac); }

    /* Layout */
    .main { flex:1; display:flex; overflow:hidden; min-height:0; }
    .tbl-section { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }

    /* Toolbar */
    .toolbar { padding:8px 16px; border-bottom:1px solid var(--bd); display:flex; align-items:center; gap:14px; flex-shrink:0; flex-wrap:wrap; }
    .fg { display:flex; align-items:center; gap:5px; }
    .fg label { color:var(--mu); font-size:11px; }
    .fg select { background:var(--s2); border:1px solid var(--bd); border-radius:4px; color:var(--tx); font-size:11px; padding:3px 6px; cursor:pointer; outline:none; }
    .cnt { margin-left:auto; color:var(--mu); font-size:11px; }

    /* Table */
    .tbl-wrap { flex:1; overflow:auto; }
    table { width:100%; border-collapse:collapse; }
    thead th { background:var(--s1); border-bottom:1px solid var(--bd); color:var(--mu); font-size:11px; font-weight:500; padding:6px 10px; position:sticky; text-align:right; top:0; user-select:none; white-space:nowrap; z-index:1; }
    thead th:first-child { text-align:left; }
    thead th.sc { cursor:pointer; }
    thead th.sc:hover { color:var(--tx); }
    thead th.asc::after  { content:' ↑'; color:var(--ac); }
    thead th.desc::after { content:' ↓'; color:var(--ac); }
    tbody tr { border-bottom:1px solid var(--bd); cursor:pointer; transition:background .1s; }
    tbody tr:hover  { background:var(--s2); }
    tbody tr.sel    { background:rgba(31,111,235,.12); }
    tbody tr.msg    { cursor:default; }
    td { padding:8px 10px; text-align:right; white-space:nowrap; vertical-align:middle; }
    td:first-child { text-align:left; }
    .tsym { font-weight:600; color:var(--bl); }
    .tname { display:block; font-size:10px; color:var(--mu); font-weight:400; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
    .up   { color:var(--gr); }
    .dn   { color:var(--re); }
    .neu  { color:var(--mu); }
    .fb { display:inline-block; border-radius:3px; font-size:9px; font-weight:600; padding:1px 5px; text-transform:uppercase; margin-left:4px; }
    .fb-micro { background:rgba(248,81,73,.15); color:var(--re); }
    .fb-low   { background:rgba(210,153,34,.15); color:var(--ye); }
    .fb-mid   { background:rgba(88,166,255,.15); color:var(--bl); }
    .fb-high  { background:rgba(63,185,80,.15);  color:var(--gr); }
    .rv-hot  { color:var(--re); font-weight:600; }
    .rv-warm { color:var(--ye); }
    .rm { background:none; border:none; color:transparent; cursor:pointer; font-size:13px; padding:2px 6px; border-radius:3px; }
    tr:hover .rm     { color:var(--mu); }
    .rm:hover        { color:var(--re) !important; background:rgba(248,81,73,.1); }

    /* Custom bar */
    .cbar { border-top:1px solid var(--bd); display:flex; gap:8px; padding:8px 16px; flex-shrink:0; }
    .cbar.hidden { display:none; }
    #addIn { flex:1; background:var(--s2); border:1px solid var(--bd); border-radius:6px; color:var(--tx); font-size:13px; outline:none; padding:5px 10px; text-transform:uppercase; }
    #addIn:focus { border-color:var(--ac); }
    .btn-add { background:var(--ac); border:none; border-radius:6px; color:#fff; cursor:pointer; font-size:12px; font-weight:500; padding:5px 14px; }
    .btn-add:hover { background:#388bfd; }

    /* Chart section */
    .chart-sec { border-left:1px solid var(--bd); display:flex; flex-direction:column; width:460px; min-width:460px; overflow:hidden; }
    .chart-sec.hidden { display:none; }
    .chart-top { border-bottom:1px solid var(--bd); display:flex; align-items:flex-start; justify-content:space-between; flex-shrink:0; flex-wrap:wrap; gap:8px; padding:10px 14px; }
    .csym { display:block; font-size:22px; font-weight:700; color:var(--bl); }
    .cname { display:block; font-size:11px; color:var(--mu); margin-top:1px; }
    .cctrl { display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
    .pg,.tg { display:flex; gap:3px; }
    .pb,.tb { background:var(--s2); border:1px solid var(--bd); border-radius:4px; color:var(--mu); cursor:pointer; font-size:11px; padding:3px 7px; transition:all .12s; }
    .pb:hover,.tb:hover { color:var(--tx); }
    .pb.active,.tb.active { background:var(--ac); border-color:var(--ac); color:#fff; }
    .close-c { background:var(--s2); border:1px solid var(--bd); border-radius:4px; color:var(--mu); cursor:pointer; font-size:14px; line-height:1; padding:3px 7px; transition:all .12s; }
    .close-c:hover { color:var(--re); border-color:var(--re); }
    .cstats { border-bottom:1px solid var(--bd); display:grid; grid-template-columns:repeat(3,1fr); background:var(--bd); gap:1px; flex-shrink:0; }
    .stat { background:var(--s1); padding:6px 10px; }
    .slbl { color:var(--mu); font-size:9px; text-transform:uppercase; letter-spacing:.4px; }
    .sval { font-size:12px; font-weight:600; margin-top:1px; }
    #chartBox { flex:1; min-height:0; position:relative; }
    .cmsg { align-items:center; color:var(--mu); display:flex; height:100%; justify-content:center; font-size:13px; flex-direction:column; gap:8px; }

    /* Spinner */
    .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--bd); border-top-color:var(--ac); border-radius:50%; animation:sp .6s linear infinite; vertical-align:middle; }
    @keyframes sp { to { transform:rotate(360deg); } }

    /* Scanner */
    .btn-scan { background:var(--ac); border:none; border-radius:6px; color:#fff; cursor:pointer; font-size:13px; font-weight:600; padding:6px 16px; white-space:nowrap; transition:background .15s; }
    .btn-scan:hover { background:#388bfd; }
    .btn-scan:disabled { opacity:.5; cursor:not-allowed; }
    .scan-st { color:var(--mu); font-size:11px; }
    .score-b { display:inline-block; border-radius:4px; font-size:12px; font-weight:700; min-width:36px; padding:2px 7px; text-align:center; }
    .sc-hot  { background:rgba(63,185,80,.2);  color:var(--gr); }
    .sc-warm { background:rgba(210,153,34,.2); color:var(--ye); }
    .sc-mid  { background:rgba(88,166,255,.2); color:var(--bl); }
    .sc-cold { background:var(--s2); color:var(--mu); }
    .sig { display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px; text-transform:uppercase; margin-right:3px; white-space:nowrap; }
    .sig-hot     { background:rgba(248,81,73,.2);  color:var(--re); }
    .sig-gapper  { background:rgba(63,185,80,.2);  color:var(--gr); }
    .sig-squeeze { background:rgba(210,153,34,.2); color:var(--ye); }
    .sig-float   { background:rgba(88,166,255,.2); color:var(--bl); }
    .sig-trend   { background:rgba(31,111,235,.2); color:#7aa4ff;   }
    .sig-warm    { background:rgba(210,153,34,.15);color:var(--ye); }

    /* Misc */
    .hidden { display:none !important; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--bd); border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--mu); }
  </style>
</head>
<body>

<header>
  <div class="logo">Stock Picker</div>
  <div id="mkt" class="mkt mkt-closed">Checking…</div>
  <div class="search-wrap">
    <input id="sInput" type="text" placeholder="Search ticker or company…" autocomplete="off">
    <div id="sDrop" class="s-drop hidden"></div>
  </div>
  <button id="refreshBtn" class="btn-ic" title="Refresh">↻</button>
  <span class="disc">For informational use only · Not financial advice</span>
</header>

<div class="tabs">
  <button class="tab active" data-tab="low">Low Float</button>
  <button class="tab" data-tab="high">High Float</button>
  <button class="tab" data-tab="custom">Watchlist</button>
  <button class="tab" data-tab="scan">Scanner ⚡</button>
</div>

<div class="main">
  <div class="tbl-section">
    <div id="regBar" class="toolbar">
      <div class="fg">
        <label>Float</label>
        <select id="fFl">
          <option value="">All</option>
          <option value="micro">Micro &lt;1M</option>
          <option value="low">Low 1–20M</option>
          <option value="mid">Mid 20–100M</option>
          <option value="big">High &gt;100M</option>
        </select>
      </div>
      <div class="fg">
        <label>Rel.Vol</label>
        <select id="fVl">
          <option value="">All</option>
          <option value="1">≥ 1×</option>
          <option value="2">≥ 2×</option>
          <option value="5">≥ 5×</option>
        </select>
      </div>
      <div class="fg">
        <label>Change</label>
        <select id="fCh">
          <option value="">All</option>
          <option value="up5">+5%+</option>
          <option value="up2">+2%+</option>
          <option value="dn2">−2%+</option>
          <option value="dn5">−5%+</option>
        </select>
      </div>
      <span id="cnt" class="cnt"></span>
    </div>

    <div id="scanBar" class="toolbar hidden">
      <button id="scanBtn" class="btn-scan">⚡ Scan Market</button>
      <span id="scanSt" class="scan-st"></span>
      <div class="fg">
        <label>Cap</label>
        <select id="sCap">
          <option value="">Any Cap</option>
          <option value="micro">Micro &lt;300M</option>
          <option value="small">Small 300M–2B</option>
          <option value="mid">Mid 2B–10B</option>
          <option value="large">Large &gt;10B</option>
        </select>
      </div>
      <div class="fg">
        <label>Min Score</label>
        <select id="sMin">
          <option value="0">Any Score</option>
          <option value="30">30+</option>
          <option value="50">50+</option>
          <option value="70">70+</option>
        </select>
      </div>
      <span id="scnt" class="cnt"></span>
    </div>

    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th class="sc" data-col="ticker">Ticker</th>
            <th class="sc" data-col="price">Price</th>
            <th class="sc" data-col="changePct">Change %</th>
            <th class="sc" data-col="volume">Volume</th>
            <th class="sc" data-col="relVol">Rel.Vol</th>
            <th class="sc" data-col="float">Float</th>
            <th class="sc" data-col="mktCap">Mkt Cap</th>
            <th class="sc" data-col="shortPct">Short %</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div id="cbar" class="cbar hidden">
      <input id="addIn" type="text" placeholder="Add ticker (e.g. GME)" maxlength="12">
      <button id="addBtn" class="btn-add">Add</button>
    </div>
  </div>

  <div id="chartSec" class="chart-sec hidden">
    <div class="chart-top">
      <div>
        <span class="csym" id="cSym">—</span>
        <span class="cname" id="cName"></span>
      </div>
      <div class="cctrl">
        <div class="pg">
          <button class="pb" data-p="5d">5D</button>
          <button class="pb active" data-p="1mo">1M</button>
          <button class="pb" data-p="3mo">3M</button>
          <button class="pb" data-p="1y">1Y</button>
          <button class="pb" data-p="5y">5Y</button>
        </div>
        <div style="display:flex;gap:5px;align-items:center">
          <div class="tg">
            <button class="tb active" data-t="candlestick">Candle</button>
            <button class="tb" data-t="line">Line</button>
          </div>
          <button id="closeC" class="close-c">✕</button>
        </div>
      </div>
    </div>
    <div id="cStats" class="cstats"></div>
    <div id="chartBox"></div>
  </div>
</div>

<script>
/* ================================================================
   STOCK PICKER  ·  Data: Yahoo Finance public API (no key needed)
================================================================ */

const YF = 'https://query1.finance.yahoo.com';

const PRESETS = {
  low:  ['GME','AMC','MVIS','CLOV','WKHS','NKLA','SPCE','SNDL','KOSS','FFIE'],
  high: ['AAPL','MSFT','NVDA','TSLA','AMZN','META','GOOGL','JPM','BAC','KO'],
};

// Curated scan universe — broad mix of volatile, high-SI, meme, growth, and sector stocks.
// Uses the same v7 quote endpoint (no auth needed), so this always works.
const SCAN_UNIVERSE = [
  // Mega cap / index heavyweights
  'AAPL','MSFT','NVDA','TSLA','AMZN','META','GOOGL','NFLX','AMD',
  // Growth / SaaS
  'SHOP','PLTR','COIN','RBLX','SNOW','DDOG','CRWD','NET','ZS','AFRM','UPST','DKNG',
  // Fintech / Banks
  'SQ','PYPL','SOFI','HOOD','GS','JPM','BAC','C',
  // EV / Clean energy
  'LCID','RIVN','NIO','LI','XPEV','WKHS','BLNK','CHPT','FSLR','ENPH','PLUG',
  // Crypto-adjacent
  'RIOT','MARA','CLSK','MSTR',
  // Meme / High retail interest
  'GME','AMC','MVIS','CLOV','NKLA','SPCE','SNDL','KOSS','FFIE','BB',
  // Biotech / Pharma
  'MRNA','BNTX','NVAX','PFE','REGN','BIIB',
  // Consumer / Misc high-vol
  'BYND','CVNA','FUBO','OPEN','PRTY',
  // Energy
  'XOM','CVX','OXY','DVN',
  // China ADRs
  'BABA','JD','PDD','BIDU',
  // Semiconductors
  'INTC','QCOM','MU','LRCX',
  // ETFs
  'SPY','QQQ','IWM','ARKK','ARKG',
  // Misc
  'RKT','UWMC','CANO','ATVI','RDFN',
];

const S = {
  tab: 'low',
  tickers: { low: [...PRESETS.low], high: [...PRESETS.high], custom: [] },
  stocks: {},          // ticker → data
  sort: { col: 'changePct', dir: 'desc' },
  fil: { float: '', vol: '', change: '' },
  sel: null,           // selected ticker
  chart: { period: '1mo', type: 'candlestick', inst: null },
};

const SCAN = {
  results: [], running: false, lastRun: null,
  sortCol: 'score', sortDir: 'desc',
  cap: '', minScore: 0,
};

const REG_HEAD = `
  <th class="sc" data-col="ticker">Ticker</th>
  <th class="sc" data-col="price">Price</th>
  <th class="sc" data-col="changePct">Change %</th>
  <th class="sc" data-col="volume">Volume</th>
  <th class="sc" data-col="relVol">Rel.Vol</th>
  <th class="sc" data-col="float">Float</th>
  <th class="sc" data-col="mktCap">Mkt Cap</th>
  <th class="sc" data-col="shortPct">Short %</th>
  <th></th>`;

const SCN_HEAD = `
  <th class="sc" data-col="score" style="text-align:center">Score</th>
  <th class="sc" data-col="ticker">Ticker</th>
  <th class="sc" data-col="price">Price</th>
  <th class="sc" data-col="changePct">Change %</th>
  <th class="sc" data-col="volume">Volume</th>
  <th class="sc" data-col="relVol">Rel.Vol</th>
  <th class="sc" data-col="float">Float</th>
  <th class="sc" data-col="mktCap">Mkt Cap</th>
  <th>Signals</th>`;

function setRegHead() {
  document.querySelector('thead tr').innerHTML = REG_HEAD;
  document.querySelectorAll('thead th.sc').forEach(th=>{
    th.addEventListener('click', ()=>{
      const c=th.dataset.col;
      S.sort.dir = S.sort.col===c?(S.sort.dir==='asc'?'desc':'asc'):'desc';
      S.sort.col = c; renderTable();
    });
  });
}

function setScannHead() {
  document.querySelector('thead tr').innerHTML = SCN_HEAD;
  document.querySelectorAll('thead th.sc').forEach(th=>{
    th.addEventListener('click', ()=>{
      const c=th.dataset.col;
      SCAN.sortDir = SCAN.sortCol===c?(SCAN.sortDir==='asc'?'desc':'asc'):(c==='score'?'desc':'asc');
      SCAN.sortCol = c; renderScanner();
    });
  });
}

// ── Formatters ────────────────────────────────────────────────
function fP(v)  { if (v==null) return '—'; return v<1?`$${v.toFixed(4)}`:`$${v.toFixed(2)}`; }
function fPct(v){ if (v==null) return '—'; return `${v>=0?'+':''}${v.toFixed(2)}%`; }
function fN(v)  {
  if (v==null) return '—';
  if (v>=1e12) return `${(v/1e12).toFixed(2)}T`;
  if (v>=1e9)  return `${(v/1e9).toFixed(2)}B`;
  if (v>=1e6)  return `${(v/1e6).toFixed(2)}M`;
  if (v>=1e3)  return `${(v/1e3).toFixed(1)}K`;
  return v.toLocaleString();
}
function fSP(v) { if (v==null) return '—'; return `${(v*100).toFixed(1)}%`; }
function rv(vol,avg) { return (!vol||!avg) ? null : vol/avg; }
function fbadge(f) {
  if (f==null) return '';
  if (f<1e6)   return '<span class="fb fb-micro">Micro</span>';
  if (f<20e6)  return '<span class="fb fb-low">Low</span>';
  if (f<100e6) return '<span class="fb fb-mid">Mid</span>';
  return '<span class="fb fb-high">High</span>';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Yahoo Finance API ──────────────────────────────────────────
async function fetchQuotes(tickers) {
  const fields = [
    'regularMarketPrice','regularMarketChange','regularMarketChangePercent',
    'regularMarketVolume','averageDailyVolume3Month','marketCap',
    'shortName','longName','exchange',
    'regularMarketOpen','regularMarketDayHigh','regularMarketDayLow',
    'regularMarketPreviousClose','fiftyTwoWeekHigh','fiftyTwoWeekLow',
    'trailingPE','floatShares','sharesOutstanding','shortPercentOfFloat',
  ].join(',');
  const url = `${YF}/v7/finance/quote?symbols=${tickers.join(',')}&fields=${fields}&corsDomain=finance.yahoo.com`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  return (j.quoteResponse?.result || []).map(q => ({
    ticker:    q.symbol,
    name:      q.shortName || q.longName || q.symbol,
    price:     q.regularMarketPrice ?? null,
    changePct: q.regularMarketChangePercent ?? null,
    volume:    q.regularMarketVolume ?? null,
    avgVol:    q.averageDailyVolume3Month ?? null,
    mktCap:    q.marketCap ?? null,
    float:     q.floatShares ?? null,
    shortPct:  q.shortPercentOfFloat ?? null,
    pe:        q.trailingPE ?? null,
    high52:    q.fiftyTwoWeekHigh ?? null,
    low52:     q.fiftyTwoWeekLow ?? null,
    open:      q.regularMarketOpen ?? null,
    dayHigh:   q.regularMarketDayHigh ?? null,
    dayLow:    q.regularMarketDayLow ?? null,
    prevClose: q.regularMarketPreviousClose ?? null,
  }));
}

async function fetchHistory(ticker, period) {
  const cfg = {
    '5d':  { range:'5d',  interval:'1h'  },
    '1mo': { range:'1mo', interval:'1d'  },
    '3mo': { range:'3mo', interval:'1d'  },
    '1y':  { range:'1y',  interval:'1wk' },
    '5y':  { range:'5y',  interval:'1mo' },
  };
  const { range, interval } = cfg[period] || cfg['1mo'];
  const intraday = interval === '1h';
  const url = `${YF}/v8/finance/chart/${encodeURIComponent(ticker)}?range=${range}&interval=${interval}&corsDomain=finance.yahoo.com`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  const res = j.chart?.result?.[0];
  if (!res) throw new Error('No chart data');
  const ts = res.timestamp || [];
  const q  = res.indicators?.quote?.[0] || {};
  const { open:O, high:H, low:L, close:C, volume:V } = q;
  const data = [];
  for (let i = 0; i < ts.length; i++) {
    if (C[i]==null) continue;
    const time = intraday ? ts[i] : new Date(ts[i]*1000).toISOString().split('T')[0];
    data.push({
      time,
      open:  +((O[i]||C[i]).toFixed(4)),
      high:  +((H[i]||C[i]).toFixed(4)),
      low:   +((L[i]||C[i]).toFixed(4)),
      close: +(C[i].toFixed(4)),
      volume: V[i]||0,
    });
  }
  return { data, intraday };
}

async function searchYF(q) {
  const url = `${YF}/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8&newsCount=0&corsDomain=finance.yahoo.com`;
  const r = await fetch(url);
  if (!r.ok) return [];
  const j = await r.json();
  return (j.quotes||[]).filter(x=>x.quoteType==='EQUITY'&&x.symbol)
    .map(x=>({ sym:x.symbol, name:x.shortname||x.longname||'', exch:x.exchange||'' }))
    .slice(0,6);
}

function updateMkt() {
  const el = document.getElementById('mkt');
  const ny = new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  const d  = ny.getDay();
  const m  = ny.getHours()*60 + ny.getMinutes();
  let label, cls;
  if (d===0||d===6)              { label='Weekend Closed'; cls='mkt-closed'; }
  else if (m>=240 && m<570)      { label='Pre-Market';     cls='mkt-pre';    }
  else if (m>=570 && m<960)      { label='Market Open';    cls='mkt-open';   }
  else if (m>=960 && m<1200)     { label='After Hours';    cls='mkt-pre';    }
  else                           { label='Market Closed';  cls='mkt-closed'; }
  el.textContent = label;
  el.className = `mkt ${cls}`;
}

async function loadTab() {

// ── Table render ───────────────────────────────────────────────
function visible() {
  let stocks = S.tickers[S.tab].map(t=>S.stocks[t]).filter(Boolean);

  const ff = S.fil.float;
  if (ff) stocks = stocks.filter(s=>{
    const f=s.float;
    if (!f) return false;
    return ff==='micro'?f<1e6:ff==='low'?f>=1e6&&f<20e6:ff==='mid'?f>=20e6&&f<100e6:f>=100e6;
  });

  const fv = parseFloat(S.fil.vol);
  if (fv) stocks = stocks.filter(s=>{ const r=rv(s.volume,s.avgVol); return r!=null&&r>=fv; });

  const fc = S.fil.change;
  if (fc) stocks = stocks.filter(s=>{
    const c=s.changePct;
    if (c==null) return false;
    return fc==='up5'?c>=5:fc==='up2'?c>=2:fc==='dn2'?c<=-2:c<=-5;
  });

  const {col,dir} = S.sort;
  const m = dir==='asc'?1:-1;
  stocks.sort((a,b)=>{
    let av,bv;
    if      (col==='ticker')   { av=a.ticker;   bv=b.ticker;   }
    else if (col==='price')    { av=a.price;    bv=b.price;    }
    else if (col==='changePct'){ av=a.changePct;bv=b.changePct;}
    else if (col==='volume')   { av=a.volume;   bv=b.volume;   }
    else if (col==='relVol')   { av=rv(a.volume,a.avgVol); bv=rv(b.volume,b.avgVol); }
    else if (col==='float')    { av=a.float;    bv=b.float;    }
    else if (col==='mktCap')   { av=a.mktCap;   bv=b.mktCap;   }
    else if (col==='shortPct') { av=a.shortPct; bv=b.shortPct; }
    if (av==null) return 1; if (bv==null) return -1;
    return typeof av==='string'?m*av.localeCompare(bv):m*(av-bv);
  });
  return stocks;
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  const stocks = visible();
  const custom = S.tab==='custom';

  document.getElementById('cnt').textContent = `${stocks.length} stock${stocks.length!==1?'s':''}`;

  // Sort indicators
  document.querySelectorAll('thead th.sc').forEach(th=>{
    th.classList.remove('asc','desc');
    if (th.dataset.col===S.sort.col) th.classList.add(S.sort.dir);
  });

  if (!stocks.length) {
    tbody.innerHTML = '<tr class="msg"><td colspan="9" style="text-align:center;padding:20px;color:var(--mu)">No stocks match the current filters.</td></tr>';
    return;
  }

  tbody.innerHTML = stocks.map(s=>{
    const r    = rv(s.volume,s.avgVol);
    const rvTx = r==null?'—':`${r.toFixed(1)}×`;
    const rvCl = r==null?'':r>=5?'rv-hot':r>=2?'rv-warm':'';
    const chCl = s.changePct>0?'up':s.changePct<0?'dn':'neu';
    const sel  = S.sel===s.ticker?' sel':'';
    const fltTx= s.float!=null?`${fN(s.float)}${fbadge(s.float)}`:'—';
    return `<tr data-t="${esc(s.ticker)}" class="${sel.trim()}">
      <td><span class="tsym">${esc(s.ticker)}</span><span class="tname">${esc(s.name)}</span></td>
      <td>${fP(s.price)}</td>
      <td class="${chCl}">${fPct(s.changePct)}</td>
      <td>${fN(s.volume)}</td>
      <td class="${rvCl}">${rvTx}</td>
      <td>${fltTx}</td>
      <td>${fN(s.mktCap)}</td>
      <td>${fSP(s.shortPct)}</td>
      <td>${custom?`<button class="rm" data-t="${esc(s.ticker)}" title="Remove">✕</button>`:''}</td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr[data-t]').forEach(row=>{
    row.addEventListener('click', e=>{ if (e.target.classList.contains('rm')) return; openChart(row.dataset.t); });
  });
  tbody.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); removeTicker(btn.dataset.t); });
  });
}

function renderStats(s) {
  const items = [
    ['Open',   fP(s.open)],   ['Day Hi',  fP(s.dayHigh)], ['Day Lo', fP(s.dayLow)],
    ['Prev',   fP(s.prevClose)],['52W Hi', fP(s.high52)],  ['52W Lo', fP(s.low52)],
    ['Volume', fN(s.volume)], ['P/E', s.pe!=null?s.pe.toFixed(1):'—'], ['Short%', fSP(s.shortPct)],
  ];
  document.getElementById('cStats').innerHTML = items.map(([l,v])=>
    `<div class="stat"><div class="slbl">${l}</div><div class="sval">${v}</div></div>`

async function drawChart(ticker, period, type) {
  if (S.chart.inst) { try{S.chart.inst.remove();}catch(e){} S.chart.inst=null; }
  const box = document.getElementById('chartBox');
  box.innerHTML = '<div class="cmsg"><span class="spin"></span><span>Loading chart…</span></div>';

  let result;
  try {
    result = await fetchHistory(ticker, period);
  } catch(e) {
    box.innerHTML = `<div class="cmsg" style="color:var(--re)">Chart unavailable<br><small style="color:var(--mu)">${esc(e.message)}</small></div>`;
    return;
  }
  const { data, intraday } = result;
  if (!data.length) { box.innerHTML='<div class="cmsg">No historical data available.</div>'; return; }

  box.innerHTML = '';
  const h = Math.max(box.clientHeight||300, 220);

  const chart = LightweightCharts.createChart(box, {
    width: box.clientWidth, height: h,
    layout:    { background:{color:'#161b22'}, textColor:'#7d8590' },
    grid:      { vertLines:{color:'#21262d'}, horzLines:{color:'#21262d'} },
    crosshair: { mode: LightweightCharts.CrosshairMode?.Normal ?? 1 },
    rightPriceScale: { borderColor:'#30363d' },
    timeScale: { borderColor:'#30363d', timeVisible: intraday, secondsVisible:false },
  });
  S.chart.inst = chart;

  if (type==='candlestick') {
    const cs = chart.addCandlestickSeries({
      upColor:'#3fb950', downColor:'#f85149',
      borderUpColor:'#3fb950', borderDownColor:'#f85149',
      wickUpColor:'#3fb950',   wickDownColor:'#f85149',
    });
    cs.setData(data.map(d=>({time:d.time,open:d.open,high:d.high,low:d.low,close:d.close})));
  } else {
    const ls = chart.addLineSeries({ color:'#58a6ff', lineWidth:2 });
    ls.setData(data.map(d=>({time:d.time,value:d.close})));
  }

  const vs = chart.addHistogramSeries({ priceFormat:{type:'volume'}, priceScaleId:'vol' });
  chart.priceScale('vol').applyOptions({ scaleMargins:{top:0.82,bottom:0}, visible:false });
  vs.setData(data.map(d=>({ time:d.time, value:d.volume, color:d.close>=d.open?'rgba(63,185,80,.25)':'rgba(248,81,73,.25)' })));
  chart.timeScale().fitContent();

  const ro = new ResizeObserver(()=>{
    if (S.chart.inst===chart) chart.applyOptions({ width:box.clientWidth, height:Math.max(box.clientHeight,220) });
  });
  ro.observe(box);
}

async function addToCustom(ticker) {
  ticker = ticker.toUpperCase().trim();
  if (!ticker) return;

  // Switch to custom tab
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab==='custom'));
  S.tab = 'custom';
  document.getElementById('cbar').classList.remove('hidden');

  if (!S.tickers.custom.includes(ticker)) {
    S.tickers.custom.push(ticker);
    saveCustom();
    try {
      const data = await fetchQuotes([ticker]);
      if (data.length) S.stocks[ticker] = data[0];
      else throw new Error('not found');
    } catch(e) {
      const i = S.tickers.custom.indexOf(ticker);
      if (i!==-1) S.tickers.custom.splice(i,1);
      saveCustom();
      return;
    }
  }
  renderTable();
  if (S.stocks[ticker]) openChart(ticker);
}

function removeTicker(ticker) {
  const i = S.tickers.custom.indexOf(ticker);
  if (i!==-1) S.tickers.custom.splice(i,1);
  saveCustom();
  if (S.sel===ticker) {
    document.getElementById('chartSec').classList.add('hidden');
    S.sel=null;
    if (S.chart.inst) { try{S.chart.inst.remove();}catch(e){} S.chart.inst=null; }
  }
  renderTable();
}

function mapQuote(q, source) {
  return {
    ticker: q.symbol, name: q.shortName||q.longName||q.symbol,
    price: q.regularMarketPrice??null, changePct: q.regularMarketChangePercent??null,
    volume: q.regularMarketVolume??null, avgVol: q.averageDailyVolume3Month??null,
    mktCap: q.marketCap??null, float: q.floatShares??null,
    shortPct: q.shortPercentOfFloat??null, pe: q.trailingPE??null,
    high52: q.fiftyTwoWeekHigh??null, low52: q.fiftyTwoWeekLow??null,
    open: q.regularMarketOpen??null, dayHigh: q.regularMarketDayHigh??null,
    dayLow: q.regularMarketDayLow??null, prevClose: q.regularMarketPreviousClose??null,
    source,
  };
}

async function fetchScreener(scrId, count=30) {
  const url = `${YF}/v1/finance/screener/predefined/saved?formatted=false&scrIds=${scrId}&count=${count}&corsDomain=finance.yahoo.com`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  return (j.finance?.result?.[0]?.quotes||[]).map(q=>mapQuote(q, scrId));
}

async function fetchTrending() {
  const url = `${YF}/v1/finance/trending/US?count=20&corsDomain=finance.yahoo.com`;
  const r = await fetch(url);
  if (!r.ok) return [];
  const j = await r.json();
  const syms = (j.finance?.result?.[0]?.quotes||[])
    .map(q=>typeof q==='string'?q:q.symbol).filter(Boolean).slice(0,20);
  if (!syms.length) return [];
  const data = await fetchQuotes(syms).catch(()=>[]);
  return data.map(s=>({...s, source:'trending'}));
}

async function fetchUniverse() {
  const chunks = [];
  for (let i=0; i<SCAN_UNIVERSE.length; i+=20) chunks.push(SCAN_UNIVERSE.slice(i,i+20));
  const res = await Promise.all(chunks.map(c=>fetchQuotes(c).catch(()=>[])));
  return res.flat();
}

function scoreStock(s) {
  let score = 0;
  const signals = [];

  // Relative Volume — 35 pts (unusual activity = potential catalyst)
  const rvv = rv(s.volume, s.avgVol);
  if (rvv!=null) {
    if (rvv>=10)      { score+=35; signals.push({t:`${rvv.toFixed(0)}× Vol`,  c:'sig-hot'});     }
    else if (rvv>=5)  { score+=25; signals.push({t:`${rvv.toFixed(1)}× Vol`,  c:'sig-hot'});     }
    else if (rvv>=2)  { score+=15; signals.push({t:`${rvv.toFixed(1)}× Vol`,  c:'sig-warm'});    }
    else if (rvv>=1)  { score+=7; }
  }

  // Momentum — 30 pts (strong intraday move)
  const chg = s.changePct;
  if (chg!=null) {
    if (chg>=20)      { score+=30; signals.push({t:`+${chg.toFixed(0)}% Gapper`, c:'sig-gapper'}); }
    else if (chg>=10) { score+=22; signals.push({t:`+${chg.toFixed(0)}%`,        c:'sig-gapper'}); }
    else if (chg>=5)  { score+=14; signals.push({t:`+${chg.toFixed(0)}%`,        c:'sig-warm'});   }
    else if (chg>=2)  { score+=7; }
    else if (chg<-5)  { score-=8; }
  }

  // Short squeeze — 20 pts (high SI + buying pressure = explosive upside)
  const sp = s.shortPct!=null ? s.shortPct*100 : null;
  if (sp!=null && chg!=null && chg>0) {
    if (sp>=20)       { score+=20; signals.push({t:`${sp.toFixed(0)}% Short`, c:'sig-squeeze'}); }
    else if (sp>=10)  { score+=12; signals.push({t:`${sp.toFixed(0)}% Short`, c:'sig-squeeze'}); }
    else if (sp>=5)   { score+=5; }
  }

  // Low float — 15 pts (thin supply amplifies price moves)
  if (s.float!=null) {
    if (s.float<5e6)        { score+=15; signals.push({t:'Micro Float', c:'sig-float'}); }
    else if (s.float<20e6)  { score+=10; signals.push({t:'Low Float',   c:'sig-float'}); }
    else if (s.float<100e6) { score+=5; }
  }

  if (s.source==='trending') signals.push({t:'Trending', c:'sig-trend'});

  return { score: Math.max(0, Math.min(100, score)), signals };
}

async function runScanner() {
  if (SCAN.running) return;
  SCAN.running = true;
  const btn = document.getElementById('scanBtn');
  const st  = document.getElementById('scanSt');
  btn.disabled=true; btn.textContent='⏳ Scanning…'; st.textContent='';
  document.getElementById('tbody').innerHTML = '<tr class="msg"><td colspan="9" style="text-align:center;padding:30px"><span class="spin"></span> Fetching live data for ~100 stocks across sectors…</td></tr>';

  try {
    // Universe fetch is the guaranteed baseline (v7/finance/quote — no auth needed).
    // Screeners and trending run in parallel and supplement results if they work.
    const [universeRes, gainers, actives, smallCap, trending] = await Promise.allSettled([
      fetchUniverse(),
      fetchScreener('day_gainers', 30),
      fetchScreener('most_actives', 30),
      fetchScreener('small_cap_gainers', 25),
      fetchTrending(),
    ]);

    const seen = new Map();

    // Universe first (primary — always works)
    if (universeRes.status==='fulfilled') {
      universeRes.value.filter(s=>s.price!=null)
        .forEach(s=>seen.set(s.ticker, {...s, source:'universe'}));
    }

    // Screeners supplement (optional — require Yahoo auth, fail gracefully)
    const addSrc = (result, src) => {
      if (result.status!=='fulfilled') return;
      result.value.forEach(s=>{
        if (!seen.has(s.ticker)) seen.set(s.ticker, {...s, source:src});
        else { const e=seen.get(s.ticker); if(!e.source.includes(src)) e.source+=','+src; }
      });
    };
    addSrc(gainers,'day_gainers');
    addSrc(actives,'most_actives');
    addSrc(smallCap,'small_cap_gainers');
    addSrc(trending,'trending');

    if (!seen.size) throw new Error('No market data returned — check your internet connection');

    SCAN.results = [...seen.values()]
      .map(s=>{ const {score,signals}=scoreStock(s); return {...s,score,signals}; });
    SCAN.results.sort((a,b)=>b.score-a.score);
    SCAN.lastRun = new Date();
    SCAN.results.forEach(s=>{ S.stocks[s.ticker]=s; });

    const liveScreener = [gainers,actives,smallCap,trending].some(r=>r.status==='fulfilled'&&r.value.length>0);
    const t = SCAN.lastRun.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    st.textContent = `${t} · ${SCAN.results.length} stocks scored${liveScreener?' + live screener data':''}`;
    renderScanner();
  } catch(e) {
    document.getElementById('tbody').innerHTML = `<tr class="msg"><td colspan="9" style="text-align:center;padding:24px;color:var(--re)">
      Scan failed: ${esc(e.message)}<br><small style="color:var(--mu)">Check your internet connection and try again.</small></td></tr>`;
  } finally {
    SCAN.running=false; btn.disabled=false; btn.textContent='⚡ Scan Market';
  }
}

function renderScanner() {
  let results = [...SCAN.results];
  if (SCAN.cap) results = results.filter(s=>{
    const mc=s.mktCap; if (!mc) return false;
    return SCAN.cap==='micro'?mc<300e6:SCAN.cap==='small'?mc>=300e6&&mc<2e9:SCAN.cap==='mid'?mc>=2e9&&mc<10e9:mc>=10e9;
  });
  if (SCAN.minScore>0) results=results.filter(s=>s.score>=SCAN.minScore);

  const sm=SCAN.sortDir==='asc'?1:-1;
  results.sort((a,b)=>{
    let av,bv;
    if      (SCAN.sortCol==='score')    { av=a.score;    bv=b.score;    }
    else if (SCAN.sortCol==='ticker')   { av=a.ticker;   bv=b.ticker;   }
    else if (SCAN.sortCol==='price')    { av=a.price;    bv=b.price;    }
    else if (SCAN.sortCol==='changePct'){ av=a.changePct;bv=b.changePct;}
    else if (SCAN.sortCol==='volume')   { av=a.volume;   bv=b.volume;   }
    else if (SCAN.sortCol==='relVol')   { av=rv(a.volume,a.avgVol); bv=rv(b.volume,b.avgVol); }
    else if (SCAN.sortCol==='float')    { av=a.float;    bv=b.float;    }
    else if (SCAN.sortCol==='mktCap')   { av=a.mktCap;   bv=b.mktCap;  }
    if (av==null) return 1; if (bv==null) return -1;
    return typeof av==='string'?sm*av.localeCompare(bv):sm*(av-bv);
  });

  document.getElementById('scnt').textContent = `${results.length} opportunit${results.length!==1?'ies':'y'}`;
  document.querySelectorAll('thead th.sc').forEach(th=>{
    th.classList.remove('asc','desc');
    if (th.dataset.col===SCAN.sortCol) th.classList.add(SCAN.sortDir);
  });

  const tbody = document.getElementById('tbody');
  if (!results.length) {
    tbody.innerHTML='<tr class="msg"><td colspan="9" style="text-align:center;padding:20px;color:var(--mu)">No results match the current filters.</td></tr>';
    return;
  }

  tbody.innerHTML = results.map(s=>{
    const r   = rv(s.volume,s.avgVol);
    const rvTx= r==null?'—':`${r.toFixed(1)}×`;
    const rvCl= r==null?'':r>=5?'rv-hot':r>=2?'rv-warm':'';
    const chCl= s.changePct>0?'up':s.changePct<0?'dn':'neu';
    const sel = S.sel===s.ticker?' sel':'';
    const scCl= s.score>=70?'sc-hot':s.score>=45?'sc-warm':s.score>=25?'sc-mid':'sc-cold';
    const sigs= s.signals.map(sg=>`<span class="sig ${sg.c}">${esc(sg.t)}</span>`).join('');
    return `<tr data-t="${esc(s.ticker)}" class="${sel.trim()}">
      <td style="text-align:center"><span class="score-b ${scCl}">${s.score}</span></td>
      <td><span class="tsym">${esc(s.ticker)}</span><span class="tname">${esc(s.name)}</span></td>
      <td>${fP(s.price)}</td>
      <td class="${chCl}">${fPct(s.changePct)}</td>
      <td>${fN(s.volume)}</td>
      <td class="${rvCl}">${rvTx}</td>
      <td>${s.float!=null?`${fN(s.float)}${fbadge(s.float)}`:'—'}</td>
      <td>${fN(s.mktCap)}</td>
      <td>${sigs||'<span style="color:var(--mu);font-size:10px">—</span>'}</td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('tr[data-t]').forEach(row=>{
    row.addEventListener('click', ()=>openChart(row.dataset.t));
  });
}

// ── Events ─────────────────────────────────────────────────────
function setupEvents() {
  // Tab switching
  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      S.tab = tab.dataset.tab;
      const isScan = S.tab==='scan';
      document.getElementById('regBar').classList.toggle('hidden', isScan);
      document.getElementById('scanBar').classList.toggle('hidden', !isScan);
      document.getElementById('cbar').classList.toggle('hidden', S.tab!=='custom');
      if (isScan) {
        setScannHead();
        if (!SCAN.results.length) {
          document.getElementById('tbody').innerHTML = '<tr class="msg"><td colspan="9" style="text-align:center;padding:30px;color:var(--mu)">Click <strong style="color:var(--tx)">⚡ Scan Market</strong> to find high-potential stocks across the full market.</td></tr>';
          document.getElementById('scnt').textContent='';
        } else { renderScanner(); }
      } else {
        setRegHead();
        if (S.sel && !S.tickers[S.tab]?.includes(S.sel)) {
          document.getElementById('chartSec').classList.add('hidden'); S.sel=null;
        }
        const hasData = S.tickers[S.tab]?.some(t=>S.stocks[t]);
        if (!hasData) loadTab(); else renderTable();
      }
    });
  });

  // Sort (initial bind — re-bound by setRegHead/setScannHead on tab switch)
  document.querySelectorAll('thead th.sc').forEach(th=>{
    th.addEventListener('click', ()=>{
      const c=th.dataset.col;
      S.sort.dir = S.sort.col===c ? (S.sort.dir==='asc'?'desc':'asc') : 'desc';
      S.sort.col = c;
      renderTable();
    });
  });

  // Filters
  document.getElementById('fFl').addEventListener('change',e=>{S.fil.float=e.target.value;renderTable();});
  document.getElementById('fVl').addEventListener('change',e=>{S.fil.vol=e.target.value;renderTable();});
  document.getElementById('fCh').addEventListener('change',e=>{S.fil.change=e.target.value;renderTable();});

  // Refresh
  document.getElementById('refreshBtn').addEventListener('click', ()=>{
    if (S.tab==='scan') { runScanner(); return; }
    S.tickers[S.tab].forEach(t=>delete S.stocks[t]);
    loadTab();
  });

  // Chart period
  document.querySelectorAll('.pb').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.pb').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      S.chart.period = btn.dataset.p;
      if (S.sel) drawChart(S.sel, S.chart.period, S.chart.type);
    });
  });

  // Chart type
  document.querySelectorAll('.tb').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tb').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      S.chart.type = btn.dataset.t;
      if (S.sel) drawChart(S.sel, S.chart.period, S.chart.type);
    });
  });

  // Close chart
  document.getElementById('closeC').addEventListener('click', ()=>{
    document.getElementById('chartSec').classList.add('hidden');
    S.sel=null;
    if (S.chart.inst) { try{S.chart.inst.remove();}catch(e){} S.chart.inst=null; }
    S.tab==='scan' ? renderScanner() : renderTable();
  });

  // Scanner
  document.getElementById('scanBtn').addEventListener('click', runScanner);
  document.getElementById('sCap').addEventListener('change', e=>{ SCAN.cap=e.target.value; renderScanner(); });
  document.getElementById('sMin').addEventListener('change', e=>{ SCAN.minScore=+e.target.value; renderScanner(); });

  // Add ticker
  document.getElementById('addBtn').addEventListener('click', ()=>{
    const v=document.getElementById('addIn').value.trim();
    if (v) { addToCustom(v); document.getElementById('addIn').value=''; }
  });
  document.getElementById('addIn').addEventListener('keydown', e=>{
    if (e.key==='Enter') document.getElementById('addBtn').click();
  });
}

// ── Init ───────────────────────────────────────────────────────
function init() {
  const saved = loadCustom();
  S.tickers.custom = saved.length ? saved : ['GME','AMC','PLTR','SPY'];

  updateMkt();
  setInterval(updateMkt, 60000);
  setupSearch();
  setupEvents();
  loadTab();
}

init();
</script>
</body>
</html>
